name: "VDB SBOM Scan"
description: "Scan a lockfile or SBOM against VDB: known CVEs, CISA KEV and slopsquatting, with a build-failing gate; optional call-site hardening for Python"
author: "VDB"
branding:
  icon: "shield"
  color: "green"

inputs:
  file:
    description: >-
      Path to the SBOM / dependency file (CycloneDX, SPDX, package-lock.json,
      yarn.lock, pnpm-lock.yaml, requirements.txt, go.sum, Cargo.lock,
      Gemfile.lock, composer.lock, …). Empty = auto-detect in the repo root.
    required: false
    default: ""
  api-key:
    description: >-
      VDB API key (vdb_…). Strongly recommended in CI: anonymous calls share
      the runner IP pool's small lifetime trial. Free key at
      https://vdb.ai.kr/signup — store as a repo secret.
    required: false
    default: ""
  api-url:
    description: "VDB instance origin (self-hosted deployments override this)."
    required: false
    default: "https://vdb.ai.kr"
  fail-on:
    description: "Fail the job at or above this severity: critical | high | medium | low | never"
    required: false
    default: "high"
  harden:
    description: >-
      Also run call-site hardening (Python): can attacker-controlled data
      reach a dangerous sink through your dependencies? Runs
      `uvx --from vdb-mcp vdb harden` and ranks what to fix first.
    required: false
    default: "false"
  harden-manifest:
    description: >-
      Lockfile / SBOM the hardening analysis resolves the dependency graph
      from. Empty = the first of uv.lock, poetry.lock, requirements.txt,
      *.cdx.json in the workspace root.
    required: false
    default: ""
  harden-path:
    description: "Source tree (or one file) to analyze. Default: the workspace root."
    required: false
    default: "."
  harden-target:
    description: "Project risk the remediation combination should get under (0–1)."
    required: false
    default: "0.2"
  harden-fail-on:
    description: >-
      When to fail the check: open (a decided dataflow path is open) |
      incomplete (also when the analysis could not decide the paths) | never
    required: false
    default: "open"

outputs:
  critical:
    description: "Number of critical findings"
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: "Number of high findings"
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: "Number of medium findings"
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: "Number of low findings"
    value: ${{ steps.scan.outputs.low }}
  kev:
    description: "Findings on the CISA Known-Exploited list"
    value: ${{ steps.scan.outputs.kev }}
  components-matched:
    description: "Components with at least one advisory"
    value: ${{ steps.scan.outputs.components_matched }}
  harden-status:
    description: "clean | open | incomplete | error (empty when harden is off)"
    value: ${{ steps.harden.outputs.harden-status }}
  harden-risk:
    description: "Project risk score, e.g. 0.37, or an interval when incomplete"
    value: ${{ steps.harden.outputs.harden-risk }}
  harden-paths:
    description: "Decided dataflow paths that are open"
    value: ${{ steps.harden.outputs.harden-paths }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        VDB_INPUT_FILE: ${{ inputs.file }}
        VDB_INPUT_API_KEY: ${{ inputs.api-key }}
        VDB_INPUT_API_URL: ${{ inputs.api-url }}
        VDB_INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: python3 "$GITHUB_ACTION_PATH/scan.py"
    # 하드닝은 옵트인. uv 는 setup-uv 로 깔고, 셀프호스트 러너에서 그 스텝이
    # 실패해도 harden.py 가 pip 으로 한 번 더 시도한다.
    - if: ${{ inputs.harden == 'true' }}
      uses: astral-sh/setup-uv@v10
      continue-on-error: true
    - id: harden
      if: ${{ inputs.harden == 'true' }}
      shell: bash
      env:
        VDB_INPUT_HARDEN_MANIFEST: ${{ inputs.harden-manifest }}
        VDB_INPUT_HARDEN_PATH: ${{ inputs.harden-path }}
        VDB_INPUT_HARDEN_TARGET: ${{ inputs.harden-target }}
        VDB_INPUT_HARDEN_FAIL_ON: ${{ inputs.harden-fail-on }}
        VDB_INPUT_API_KEY: ${{ inputs.api-key }}
        VDB_INPUT_API_URL: ${{ inputs.api-url }}
      run: python3 "$GITHUB_ACTION_PATH/harden.py"
